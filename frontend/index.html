<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNOVEA - AI Voice Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', 'Inter', sans-serif; }

body { 
    background: linear-gradient(135deg, #0d0614 0%, #1a0b2e 50%, #2a083b 100%);
    color: #f3f4f6; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 20px; 
    overflow: hidden;
    position: relative;
}

.bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    opacity: 0.75;
    pointer-events: none;
}

.bg-orb-1 { width: 350px; height: 350px; background: linear-gradient(135deg, #4c1d95, #7e22ce); top: 10%; right: 20%; }
.bg-orb-2 { width: 280px; height: 280px; background: linear-gradient(135deg, #581c87, #3b0764); bottom: 10%; left: 18%; }
.bg-orb-3 { width: 210px; height: 210px; background: #a855f7; top: 40%; left: 35%; opacity: 0.35; }

.container { 
    position: relative;
    z-index: 10;
    width: 100%; 
    max-width: 620px; 
    background: rgba(25, 12, 40, 0.45); 
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    border: 1px solid rgba(216, 180, 254, 0.18); 
    border-radius: 28px; 
    padding: 38px; 
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(216, 180, 254, 0.05); 
    text-align: center; 
}

h1 { 
    font-size: 2.5rem; 
    font-weight: 700; 
    letter-spacing: 0.05em; 
    color: #f3e8ff;
    margin-bottom: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(216, 180, 254, 0.3);
}

p.subtitle { 
    color: #e9d5ff; 
    font-size: 0.88rem; 
    margin-bottom: 24px; 
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.85;
}

/* Google Voice Style Rotating Ring Container */
.visualizer-container {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 0 auto 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

/* Animated Google-Style Gradient Glow Ring */
.visualizer-container::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(#4285f4, #ea4335, #fbbc05, #34a853, #4285f4);
    opacity: 0;
    filter: blur(6px);
    transition: opacity 0.4s ease;
    z-index: 1;
}

.visualizer-container.listening::before {
    opacity: 1;
    animation: rotateGradient 2s linear infinite;
}

@keyframes rotateGradient {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

canvas#orb {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
}

.mic-button {
    position: relative;
    z-index: 10;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(216, 180, 254, 0.12);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 2px solid rgba(216, 180, 254, 0.4);
    color: #f3e8ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
}

.mic-button:hover {
    transform: scale(1.05);
    background: rgba(216, 180, 254, 0.25);
    border-color: #d8b4fe;
    box-shadow: 0 0 30px rgba(216, 180, 254, 0.6);
}

.mic-button.listening {
    background: rgba(13, 6, 20, 0.85);
    border-color: transparent;
    color: #ffffff;
}

.mic-button svg { width: 36px; height: 36px; fill: currentColor; }

.status-badge { 
    display: inline-flex; 
    align-items: center; 
    gap: 10px; 
    padding: 8px 20px; 
    border-radius: 9999px; 
    font-size: 0.82rem; 
    font-weight: 600; 
    background: rgba(216, 180, 254, 0.08); 
    border: 1px solid rgba(216, 180, 254, 0.2);
    color: #e9d5ff; 
    margin-bottom: 12px; 
    letter-spacing: 0.05em;
}

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #71717a; }
.status-badge.active { border-color: rgba(216, 180, 254, 0.7); color: #f3e8ff; }
.status-badge.active .status-dot { background: #c084fc; box-shadow: 0 0 12px #c084fc; }

.mic-status { color: #d8b4fe; font-size: 0.88rem; margin-bottom: 22px; font-weight: 500; min-height: 22px; }

.controls { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
button.action-btn { 
    padding: 14px 28px; 
    border-radius: 16px; 
    border: 1px solid rgba(216, 180, 254, 0.3); 
    font-weight: 600; 
    font-size: 0.92rem; 
    cursor: pointer; 
    transition: all 0.25s ease; 
    backdrop-filter: blur(10px);
    letter-spacing: 0.03em;
}

.btn-start { background: rgba(216, 180, 254, 0.15); color: #f3e8ff; }
.btn-start:hover { background: rgba(216, 180, 254, 0.3); border-color: #d8b4fe; box-shadow: 0 0 25px rgba(216, 180, 254, 0.35); }

.btn-end { background: rgba(244, 63, 94, 0.25); color: #ffffff; border-color: rgba(244, 63, 94, 0.6); box-shadow: 0 0 20px rgba(244, 63, 94, 0.3); }
.btn-end:hover { background: rgba(244, 63, 94, 0.5); box-shadow: 0 0 35px rgba(244, 63, 94, 0.7); }

.btn-stop { background: rgba(13, 6, 20, 0.4); color: #e9d5ff; border-color: rgba(216, 180, 254, 0.15); }
.btn-stop:hover { background: rgba(13, 6, 20, 0.7); color: #fff; }

.chat-box { 
    background: rgba(13, 6, 20, 0.5); 
    border: 1px solid rgba(216, 180, 254, 0.15); 
    border-radius: 18px; 
    height: 200px; 
    overflow-y: auto; 
    padding: 18px; 
    text-align: left; 
    margin-bottom: 20px; 
}

.msg { margin-bottom: 12px; font-size: 0.92rem; line-height: 1.5; font-family: 'Inter', sans-serif; }
.msg.user { color: #d8b4fe; }
.msg.bot { color: #f3f4f6; }
.msg.escalated { color: #f43f5e; font-weight: 600; }

.input-row { display: flex; gap: 12px; }
input { 
    flex: 1; 
    padding: 14px 18px; 
    border-radius: 14px; 
    border: 1px solid rgba(216, 180, 254, 0.2); 
    background: rgba(13, 6, 20, 0.4); 
    color: #fff; 
    font-size: 0.92rem; 
    outline: none; 
    transition: all 0.2s ease;
}
input:focus { border-color: #d8b4fe; box-shadow: 0 0 15px rgba(216, 180, 254, 0.25); }
.btn-send { 
    background: rgba(216, 180, 254, 0.18); 
    color: #f3e8ff; 
    border: 1px solid rgba(216, 180, 254, 0.35);
    border-radius: 14px; 
    padding: 0 24px; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.2s ease;
}
.btn-send:hover { background: rgba(216, 180, 254, 0.35); border-color: #d8b4fe; }

.doctor-modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(13, 6, 20, 0.94);
    backdrop-filter: blur(35px);
    border-radius: 28px;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    border: 2px solid #f43f5e;
    box-shadow: 0 0 60px rgba(244, 63, 94, 0.4);
    animation: fadeIn 0.3s ease;
}

.doctor-avatar {
    width: 110px; height: 110px; border-radius: 50%; background: rgba(216, 180, 254, 0.05);
    border: 3px solid #f43f5e; display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px; box-shadow: 0 0 35px rgba(244, 63, 94, 0.6);
}

.doctor-avatar svg { width: 55px; height: 55px; fill: #f43f5e; }
.transfer-title { color: #f43f5e; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.05em; }
.doctor-name { color: #ffffff; font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }
.call-status { color: #e9d5ff; font-size: 0.9rem; margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }

.pulsing-ring { width: 12px; height: 12px; border-radius: 50%; background: #f43f5e; box-shadow: 0 0 12px #f43f5e; animation: frostPulse 1s infinite alternate; }
.btn-end-doctor { background: #f43f5e; color: white; padding: 14px 34px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; box-shadow: 0 0 25px rgba(244, 63, 94, 0.5); }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="container">

<div class="doctor-modal-overlay" id="doctorModal">
    <div class="doctor-avatar">
    <svg viewBox="0 0 24 24">
        <path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-7-7h-4a7 7 0 0 0-7 7v1h2v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1z"/>
    </svg>
    </div>
    <div class="transfer-title">🚨 CALL ESCALATED</div>
    <div class="doctor-name" id="modalDoctorName">Connecting to Dr. Sarah Harrison...</div>
    <div class="call-status">
    <div class="pulsing-ring"></div>
    <span id="callStatusText">Encrypted Doctor Line Connected</span>
    </div>
    <button class="btn-end-doctor" onclick="closeDoctorModal()">End Call with Doctor</button>
</div>

<h1>ZYNOVEA</h1>
<p class="subtitle">Autonomous AI Clinic Engine with Safety Escalation</p>

<div class="visualizer-container" id="visualizerContainer">
    <canvas id="orb" width="190" height="190"></canvas>
    <button class="mic-button" id="micBtn" onclick="toggleCall()" title="Click to Speak / Start Call">
    <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    </button>
</div>

<div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">Disconnected</span>
</div>

<div class="mic-status" id="micStatus">Press "Start Call" or tap the Mic button</div>

<div class="controls">
    <button class="action-btn btn-start" id="callToggleBtn" onclick="toggleCall()">Start Call</button>
    <button class="action-btn btn-stop" onclick="stopAudioPlayback()">Interrupt Speech</button>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-row">
    <input type="text" id="textInput" placeholder="Type or speak into microphone..." onkeydown="if(event.key==='Enter') sendText()">
    <button class="btn-send" onclick="sendText()">Send</button>
</div>
</div>

<script>
let ws;
let audioCtx;
let currentAudioSource = null;
let recognition = null;
let isCalling = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
    document.getElementById("micStatus").innerText = "🎙️ Listening... Speak naturally!";
    document.getElementById("micBtn").classList.add("listening");
    document.getElementById("visualizerContainer").classList.add("listening");
    };

    recognition.onresult = (event) => {
    const lastIndex = event.results.length - 1;
    const transcript = event.results[lastIndex][0].transcript.trim();
    
    if (transcript) {
        stopAudioPlayback();
        appendMsg("You (Voice)", transcript, "user");
        
        if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "user_transcript", text: transcript }));
        }
    }
    };

    recognition.onerror = (event) => {
    if (isCalling && event.error !== 'no-speech') {
        setTimeout(() => { try { recognition.start(); } catch(e) {} }, 800);
    }
    };

    recognition.onend = () => {
    if (isCalling) {
        try { recognition.start(); } catch(e) {}
    } else {
        document.getElementById("micStatus").innerText = "Call ended.";
        document.getElementById("micBtn").classList.remove("listening");
        document.getElementById("visualizerContainer").classList.remove("listening");
    }
    };
}

function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function speakTextFallback(text) {
    if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.25;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
    }
}

function connectCall() {
    initAudioContext();
    ws = new WebSocket("ws://127.0.0.1:8000/ws/call");
    
    ws.onopen = () => {
    isCalling = true;
    
    const toggleBtn = document.getElementById("callToggleBtn");
    toggleBtn.innerText = "End Call";
    toggleBtn.className = "action-btn btn-end";

    document.getElementById("statusBadge").classList.add("active");
    document.getElementById("statusText").innerText = "Connected to ZYNOVEA";
    
    if (recognition) {
        try { recognition.start(); } catch(e) {}
    }
    };

    ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
        const msg = JSON.parse(event.data);
        if (msg.type === "bot_response") {
        appendMsg("ZYNOVEA", msg.text, msg.escalated ? "escalated" : "bot");
        
        if (!msg.has_audio) speakTextFallback(msg.text);

        if (msg.escalated) {
            document.getElementById("modalDoctorName").innerText = msg.doctor_name || "Connecting to Dr. Sarah Harrison...";
            document.getElementById("doctorModal").style.display = "flex";
        }
        }
    } else if (event.data instanceof Blob) {
        stopAudioPlayback();
        const arrayBuffer = await event.data.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        currentAudioSource = audioCtx.createBufferSource();
        currentAudioSource.buffer = audioBuffer;
        currentAudioSource.connect(audioCtx.destination);
        currentAudioSource.start(0);
    }
    };

    ws.onclose = () => disconnectCallState();
}

function disconnectCallState() {
    isCalling = false;
    stopAudioPlayback();

    const toggleBtn = document.getElementById("callToggleBtn");
    toggleBtn.innerText = "Start Call";
    toggleBtn.className = "action-btn btn-start";

    document.getElementById("statusBadge").classList.remove("active");
    document.getElementById("statusText").innerText = "Disconnected";
    document.getElementById("micBtn").classList.remove("listening");
    document.getElementById("visualizerContainer").classList.remove("listening");
    document.getElementById("micStatus").innerText = "Call ended.";

    if (recognition) {
    try { recognition.stop(); } catch(e) {}
    }

    if (ws && ws.readyState === WebSocket.OPEN) ws.close();
}

function toggleCall() {
    if (!isCalling) connectCall();
    else disconnectCallState();
}

function stopAudioPlayback() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (currentAudioSource) {
    currentAudioSource.stop();
    currentAudioSource = null;
    }
}

function closeDoctorModal() {
    document.getElementById("doctorModal").style.display = "none";
    disconnectCallState();
}

function sendText() {
    const input = document.getElementById("textInput");
    const text = input.value.trim();
    if (!text) return;

    stopAudioPlayback();
    appendMsg("You", text, "user");
    
    if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "user_transcript", text: text }));
    }
    input.value = "";
}

function appendMsg(sender, text, type) {
    const chatBox = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerHTML = `<strong>${sender}:</strong> ${text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Dynamic Google Assistant Style Multi-Color Ring Canvas Drawing
const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");
let angle = 0;

function drawOrb() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 64 + Math.sin(angle) * 6;

    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);

    if (isCalling) {
    // Multi-color Google Search inspired conic gradient border
    const gradient = ctx.createConicGradient(angle, centerX, centerY);
    gradient.addColorStop(0, '#4285f4');  // Blue
    gradient.addColorStop(0.25, '#ea4335'); // Red
    gradient.addColorStop(0.5, '#fbbc05');  // Yellow
    gradient.addColorStop(0.75, '#34a853'); // Green
    gradient.addColorStop(1, '#4285f4');  // Blue

    ctx.strokeStyle = gradient;
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = "rgba(13, 6, 20, 0.7)";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "rgba(216, 180, 254, 0.3)";
    ctx.fill();
    } else {
    ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "rgba(216, 180, 254, 0.25)";
    ctx.fill();
    }

    ctx.restore();
    angle += 0.04;
    requestAnimationFrame(drawOrb);
}
drawOrb();
</script>
</body>
</html>
